<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="description" content="Tinaab — connect, create, chat and earn.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>Tinaab</title>
<link rel="stylesheet" href="frontend/css/style.css">
<link rel="stylesheet" href="frontend/css/profile-interactions.css">
<link rel="stylesheet" href="frontend/css/tiktok-post-follow.css">
<link rel="stylesheet" href="frontend/css/network-status.css">
</head>
<body>
<div id="app">
<header class="topbar">
<button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
<div class="brand">tinaab</div>
<button class="icon-btn" id="notifyBtn" aria-label="Notifications">♡</button>
</header>
<main id="feed" class="feed" aria-live="polite"></main>
<button class="fab" id="createBtn" aria-label="Create">＋</button>
<nav class="bottom-nav" aria-label="Main navigation">
<button class="nav-item active" data-view="home"><span>⌂</span><small>For You</small></button>
<button class="nav-item" data-view="chat"><span>◌</span><small>Chat</small></button>
<button class="nav-item" data-view="wallet"><span>₦</span><small>Wallet</small></button>
<button class="nav-item" data-view="profile"><span>◯</span><small>Profile</small></button>
</nav>
</div>
<script src="frontend/js/api.js"></script>
<script src="frontend/js/app.js"></script>
<script src="frontend/js/chat-enhancements.js"></script>
<script src="frontend/js/chat-composer-enhancements.js"></script>
<script src="frontend/js/signup-preview.js"></script>
<script src="frontend/js/preview-social-actions.js"></script>
<script src="frontend/js/tiktok-post-follow.js"></script>
<script src="frontend/js/profile-interactions.js"></script>
<script src="frontend/js/network-status.js"></script>
<script src="frontend/js/pwa.js"></script>
</body>
</html>
